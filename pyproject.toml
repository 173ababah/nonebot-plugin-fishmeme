[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "nonebot-plugin-fishmeme"
version = "0.1.0"
description = "群里发的表情包自动入库（dHash 去重），零 LLM 开销"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "173ababah" }]
requires-python = ">=3.9"
dependencies = ["nonebot2>=2.0.0", "nonebot-adapter-onebot>=2.2.0", "httpx>=0.24", "pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/173ababah/nonebot-plugin-fishmeme"
Repository = "https://github.com/173ababah/nonebot-plugin-fishmeme"

[tool.nonebot]
adapters = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]
plugin_name = "nonebot-plugin-fishmeme"
plugins = ["nonebot_plugin_fishmeme"]

[tool.pdm.build]
includes = ["nonebot_plugin_fishmeme"]